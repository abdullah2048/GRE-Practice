name: Research test
on:
  push:
    branches: [claude/charming-tesla-syzsw9]
    paths: [stocks/research/**, .github/workflows/research.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r stocks/requirements.txt
      - run: python stocks/research/overnight_test.py
