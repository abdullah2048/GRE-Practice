name: Daily stock prediction

on:
  schedule:
    # Mon-Fri (no Saturday/Sunday). Times are UTC; Pakistan = UTC+5.
    - cron: "45 10 * * 1-5"   # 3:45pm PKT, main daily run
    # Backup in case GitHub skips the 3:45pm run; adds nothing if it already ran.
    - cron: "47 12 * * 1-5"   # 5:47pm PKT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r stocks/requirements.txt

      - name: Fetch prices, score yesterday, predict tomorrow
        run: python stocks/predictor/run.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update stock predictions $(date -u +%F)"
            git push
          fi
