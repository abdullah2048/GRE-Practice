name: Daily stock prediction

on:
  schedule:
    # Mon-Fri after the PSX close (times in UTC; Pakistan = UTC+5).
    # GitHub often delays or drops scheduled runs, so there are backups;
    # a repeat run on the same day adds no new prediction.
    - cron: "17 12 * * 1-5"   # 5:17pm PKT (Friday close is 4:30pm)
    - cron: "47 13 * * 1-5"   # 6:47pm PKT
    - cron: "23 16 * * 1-5"   # 9:23pm PKT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r stocks/requirements.txt

      - name: Fetch prices, score yesterday, predict tomorrow
        run: python stocks/predictor/run.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update stock predictions $(date -u +%F)"
            git push
          fi
