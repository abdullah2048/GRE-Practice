<title>GRE Test Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a computer-delivered test room. Home lists five tests as papers on a desk; the test screen is a fixed-chrome ETS-style window with a two-pane body. Single light look on purpose: it mimics the real exam screen. */
:root{
  --ink:#1c2630; --ink2:#4b5a69; --paper:#ffffff; --desk:#e9edf1; --line:#c5cfd9;
  --bar:#12365a; --bar-ink:#f3f7fb; --accent:#0a7c76; --accent-soft:#dcf1ef;
  --mark:#e0a800; --good:#1d7a3a; --good-soft:#dff3e5; --bad:#b3261e; --bad-soft:#fbe4e2;
  --serif:"Source Serif 4","Times New Roman",Times,serif;
  --sans:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.5 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.choice:focus-within,.sent:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 16px;border-radius:3px;font-weight:500}
.btn:hover{background:#f3f6f9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#086660}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- home ---------- */
.home{max-width:1120px;margin:0 auto;padding-block:40px 64px}
.home h1{font:600 clamp(28px,4vw,42px)/1.1 var(--serif);letter-spacing:-.01em}
.home .lede{max-width:62ch;color:var(--ink2);margin:12px 0 28px}
.rules{display:flex;flex-wrap:wrap;gap:8px 20px;font:500 13px var(--mono);color:var(--ink2);margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tcard .no{font:600 54px/1 var(--serif);color:var(--bar)}
.tcard .nm{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.tcard .top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.secs{display:flex;flex-wrap:wrap;gap:6px}
.secs .btn{padding:5px 10px;font-size:13px}
.last{font-size:13px;color:var(--ink2);min-height:20px}
.last b{color:var(--ink)}

/* ---------- test window ---------- */
.win{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper);z-index:20;padding-top:env(safe-area-inset-top,0px)}
.topbar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px max(14px,env(safe-area-inset-left,0px)) 8px max(14px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.topbar .ttl{font:600 15px var(--sans)}
.topbar .sub{font:400 12px var(--mono);opacity:.85}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools button{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--bar-ink);padding:5px 10px;border-radius:3px;font-size:13px}
.tools button:hover{background:rgba(255,255,255,.12)}
.tools button.on{background:var(--mark);color:#1b1500;border-color:var(--mark)}
.clock{font:500 15px var(--mono);min-width:72px;text-align:right}
.clock.low{color:#ffb3ad}
.subbar{background:var(--bar2,#eef2f6);border-bottom:1px solid var(--line);padding:6px max(14px,env(safe-area-inset-left,0px));font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr;overflow:hidden}
.body.two{grid-template-columns:1fr 1fr}
.pane{overflow:auto;padding:22px max(24px,env(safe-area-inset-left,0px));min-width:0}
.pane.left{border-right:1px solid var(--line);background:#fcfdfe}
.passage p{font:400 17px/1.65 var(--serif);margin:0 0 14px}
.single{max-width:860px;margin:0 auto}
.note{font:italic 13px var(--serif);color:var(--ink2);margin-bottom:12px}
.stem{font:400 17.5px/1.6 var(--serif);margin:0 0 18px}
.stem p{margin:0 0 10px}
.instr{font:500 13px var(--sans);color:var(--ink2);margin-top:16px}
.choices{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;border:0}
.choice{display:flex;gap:12px;align-items:flex-start;padding:9px 12px;border:1px solid transparent;border-radius:3px;cursor:pointer;font:400 16.5px/1.5 var(--serif)}
.choice:hover{background:#f1f5f8}
.choice input{margin-top:6px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.choice.sel{background:var(--accent-soft);border-color:var(--accent)}
.choice.right{background:var(--good-soft);border-color:var(--good)}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad)}
.blanksgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.blanksgrid legend{font:600 13px var(--mono);margin-bottom:6px;color:var(--bar)}
.blank-pill{font:600 12px var(--mono);background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:3px;white-space:nowrap}
.qc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.qc>div{border:1px solid var(--line);padding:12px 14px;border-radius:3px;font:400 17px/1.5 var(--serif);min-width:0;overflow-wrap:anywhere}
.qc .lab{display:block;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.info{border-left:3px solid var(--line);padding:4px 12px;margin-bottom:14px;font:400 16px/1.55 var(--serif);color:var(--ink2)}
.numin{font:500 20px var(--mono);width:180px;padding:8px 10px;border:2px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink)}
.frac{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.frac hr{width:100%;margin:0;border:0;border-top:2px solid var(--ink)}
.frac .numin{width:120px;text-align:center}
.sent{cursor:pointer;border-radius:2px;padding:1px 0}
.sent:hover{background:#fff1b8}
.sent.sel{background:#ffd75e;outline:0}
.sent.right{background:var(--good-soft);box-shadow:0 0 0 2px var(--good)}
.sent.wrong{background:var(--bad-soft);box-shadow:0 0 0 2px var(--bad)}
.table-wrap{overflow-x:auto;margin:0 0 16px}
.table-wrap table{border-collapse:collapse;font:400 15px var(--sans)}
.table-wrap th,.table-wrap td{border:1px solid var(--line);padding:5px 10px;text-align:right}
.table-wrap th:first-child,.table-wrap td:first-child{text-align:left}
.fig{margin:0 0 16px}
.fig img{border:1px solid var(--line);cursor:zoom-in;max-width:100%;height:auto;display:block}
.fig figcaption{font-size:12px;color:var(--ink2);margin-top:4px}
.figtext{font:13px var(--sans);color:var(--ink2);margin:0 0 14px}
.warn{background:#fff6dc;border:1px solid #e8cf85;color:#5a4400;padding:6px 10px;border-radius:3px;font-size:13px;margin-bottom:12px}
.expl{margin-top:18px;padding:10px 12px;background:#f3f6f9;border:1px solid var(--line);border-radius:3px;font-size:14px}
.footbar{background:#eef2f6;border-top:1px solid var(--line);padding:8px max(14px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.footbar .grp{display:flex;gap:8px;flex-wrap:wrap}

/* centered screens (instructions, review, results) */
.center{overflow:auto;padding:28px max(20px,env(safe-area-inset-left,0px))}
.card{max-width:860px;margin:0 auto}
.card h2{font:600 28px/1.2 var(--serif);margin-bottom:10px}
.card h3{font:600 17px var(--sans);margin:22px 0 8px}
.card p,.card li{max-width:68ch}
.rv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0}
.rv button{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:8px 10px;display:flex;justify-content:space-between;gap:6px}
.rv button.ans{border-color:var(--accent);background:var(--accent-soft)}
.rv button.un{border-color:#e3a39e;background:#fdf1f0}
.rv .st{font-size:12px;color:var(--ink2);white-space:nowrap}
.rv .flag{color:#a87900;font-weight:700}
.awa-box{width:100%;min-height:42vh;flex:1;font:400 16px/1.6 var(--serif);padding:12px;border:1px solid var(--line);border-radius:3px;resize:none;background:var(--paper);color:var(--ink)}
.awa-wrap{display:flex;flex-direction:column;height:100%;gap:8px}
.wc{font:500 12px var(--mono);color:var(--ink2)}
table.res{border-collapse:collapse;width:100%;margin:10px 0 16px;font-variant-numeric:tabular-nums}
table.res th,table.res td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
table.res th:first-child,table.res td:first-child{text-align:left}
.scoreline{display:flex;gap:28px;flex-wrap:wrap;margin:8px 0 6px}
.scoreline .big{font:600 44px/1 var(--serif);color:var(--bar)}
.scoreline .cap{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.essay{white-space:pre-wrap;font:16px/1.6 var(--serif);border:1px solid var(--line);padding:12px;border-radius:3px;background:#fcfdfe;max-height:260px;overflow:auto}
.modal{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--paper);border-radius:4px;max-width:480px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal .box h3{font:600 20px var(--serif)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.zoom{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);overflow:auto;padding:16px;cursor:zoom-out}
.zoom img{max-width:none;width:min(1800px,200%);display:block;margin:0 auto}
.calc{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:40;width:240px;background:#2a3440;border-radius:6px;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.calc .scr{background:#dfe8d8;color:#1a2a14;font:500 22px var(--mono);text-align:right;padding:8px;border-radius:3px;min-height:42px;overflow:hidden;white-space:nowrap}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.calc .keys button{background:#44525f;color:#fff;border:0;border-radius:3px;padding:9px 0;font:500 16px var(--mono)}
.calc .keys button.op{background:#5d7185}
.calc .keys button.eq{background:var(--accent)}
.calc .keys button:hover{filter:brightness(1.15)}
.calc .hd{display:flex;justify-content:space-between;color:#c7d2dc;font:12px var(--mono);margin-bottom:6px}
.calc .hd button{background:none;border:0;color:inherit}
@media (max-width:820px){
  .body.two{grid-template-columns:1fr;grid-template-rows:minmax(0,42%) minmax(0,1fr)}
  .pane.left{border-right:0;border-bottom:1px solid var(--line)}
  .qc{grid-template-columns:1fr}
  .tools button{padding:4px 7px;font-size:12px}
  .calc{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:no-preference){.tcard{transition:box-shadow .15s}.tcard:hover{box-shadow:0 6px 20px rgba(18,54,90,.12)}}
</style>
<div id="app"></div>
<script>
"use strict";
/* test number shown on the site -> data file id */
var QV=["Quant 1","Verbal 1","Quant 2","Verbal 2"],VQ=["Verbal 1","Quant 1","Verbal 2","Quant 2"];
var TESTS=[{n:1,id:"35",awa:true,ord:QV},{n:2,id:"2",awa:true,ord:QV},{n:3,id:"12",awa:false,ord:QV},{n:4,id:"11",awa:true,ord:VQ},{n:5,id:"31",awa:false,ord:QV}];
window.GRE=window.GRE||{};
var app=document.getElementById("app");
var S=null, timer=null, calcOpen=false;
var LS={get:function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function rich(s){
  var t=esc(s).replace(/&lt;(\/?)(sup|sub|i|b|u|br)&gt;/gi,"<$1$2>");
  return t.split(/\n\n+/).map(function(p){return "<p>"+p.replace(/\n/g,"<br>")+"</p>"}).join("");
}
function inl(s){return esc(s).replace(/&lt;(\/?)(sup|sub|i|b|u)&gt;/gi,"<$1$2>")}
function mmss(sec){sec=Math.max(0,sec);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function imgUrl(id,name){return "img/t"+id+"/"+String(name).replace(/\.png$/i,".jpg")}

/* ---------- loading ---------- */
function loadTest(id,cb){
  if(window.GRE[id]) return cb(window.GRE[id]);
  var s=document.createElement("script");s.src="data/test"+id+".js";
  s.onload=function(){cb(window.GRE[id])};
  s.onerror=function(){alert2("Could not load test data. Reload the page and try again.")};
  document.head.appendChild(s);
}
function alert2(m){var d=document.createElement("div");d.className="modal";d.innerHTML='<div class="box"><h3>Notice</h3><p>'+esc(m)+'</p><div class="acts"><button class="btn primary" id="ok">OK</button></div></div>';document.body.appendChild(d);d.querySelector("#ok").onclick=function(){d.remove()}}

/* ---------- home ---------- */
function home(){
  stopTimer();S=null;calcOpen=false;
  var hist=LS.get("gre-hist")||{};
  var h='<main class="home"><h1>GRE Test Room</h1><p class="lede">Five full-length GRE General Tests in the format of the real computer-delivered exam. Take one start to finish, or practice a single section. Sections are timed, you can mark questions and review them before time runs out, and you cannot go back once a section ends.</p>';
  h+='<div class="rules"><span>Verbal 1 &middot; 12 Q &middot; 18 min</span><span>Quant 1 &middot; 12 Q &middot; 21 min</span><span>Verbal 2 &middot; 15 Q &middot; 23 min</span><span>Quant 2 &middot; 15 Q &middot; 26 min</span><span>Writing task &middot; 30 min (where the source includes one)</span></div><div class="grid">';
  TESTS.forEach(function(t){
    var l=hist[t.n];
    h+='<section class="tcard"><div class="top"><div><div class="nm">Practice test</div><div class="no">'+t.n+'</div></div></div>'+
    '<div class="last">'+(l?'Last attempt: <b>V '+l.v+' &middot; Q '+l.q+'</b> (estimate), '+esc(l.when):'Not attempted yet')+'</div>'+
    '<button class="btn primary" data-start="'+t.n+'">Start full test</button>'+
    '<div><div class="nm" style="margin-bottom:6px">Or practice one section</div><div class="secs">'+(t.awa?'<button class="btn" data-sec="'+t.n+':awa">Writing</button>':'')+t.ord.map(function(o,i){return '<button class="btn" data-sec="'+t.n+':'+i+'">'+o+'</button>'}).join("")+'</div></div></section>';
  });
  h+='</div></main>';
  app.innerHTML=h;
  app.querySelectorAll("[data-start]").forEach(function(b){b.onclick=function(){begin(+b.dataset.start,"full")}});
  app.querySelectorAll("[data-sec]").forEach(function(b){b.onclick=function(){var p=b.dataset.sec.split(":");begin(+p[0],p[1])}});
}

/* ---------- session ---------- */
function begin(n,mode){
  var t=TESTS.filter(function(x){return x.n===n})[0];
  app.innerHTML='<div class="win"><div class="center"><div class="card"><h2>Loading Test '+n+'...</h2></div></div></div>';
  loadTest(t.id,function(D){
    var plan=[];
    var hasAwa=!!(D.awa&&D.awa.prompt&&D.awa.prompt.trim());
    if(mode==="full"){plan=(hasAwa?["awa"]:[]).concat([0,1,"break",2,3])}
    else if(mode==="awa"){plan=["awa"]}
    else plan=[+mode];
    S={n:n,id:t.id,D:D,mode:mode,plan:plan,step:-1,ans:{},marks:{},awa:"",qi:0,deadline:0,view:"intro",done:{},review:false};
    instructions();
  });
}
function secInfo(si){
  if(si==="awa")return {name:"Analyze an Issue",minutes:30,type:"awa",questions:[]};
  return S.D.sections[si];
}
function instructions(){
  var full=S.mode==="full";
  var h='<div class="win"><div class="topbar"><div><div class="ttl">GRE General Test &middot; Practice Test '+S.n+'</div><div class="sub">Instructions</div></div><div class="tools"><button id="exit">Leave test</button></div></div><div class="center"><div class="card">';
  h+='<h2>'+(full?'Full-length test':'Section practice')+'</h2>';
  h+='<p>You will answer the sections below in order. Each section has its own time limit, shown at the top right. Once a section ends you cannot return to it.</p><ul>';
  S.plan.forEach(function(p){
    if(p==="break")return h+='<li>10 minute optional break</li>',0;
    var s=secInfo(p);h+='<li><b>'+esc(s.name)+'</b> &middot; '+(s.questions.length?s.questions.length+' questions &middot; ':'')+s.minutes+' min</li>'});
  h+='</ul><h3>During a section</h3><ul><li><b>Mark</b> a question to find it again in <b>Review</b>.</li><li><b>Review</b> lists every question with its status. Unanswered questions are scored as wrong, so answer every one.</li><li>Quantitative sections have an on-screen <b>Calculator</b>.</li><li><b>Hide Time</b> hides the clock. It reappears automatically in the last 5 minutes.</li></ul>';
  h+='<p style="margin-top:22px"><button class="btn primary" id="go">Begin</button></p></div></div></div>';
  app.innerHTML=h;
  document.getElementById("exit").onclick=home;
  document.getElementById("go").onclick=nextStep;
}
function nextStep(){
  S.step++;S.qi=0;S.review=false;
  if(S.step>=S.plan.length)return results();
  var p=S.plan[S.step];
  if(p==="break")return breakScreen();
  var s=secInfo(p);
  S.hideTime=false;
  S.deadline=Date.now()+s.minutes*60000;
  S.ans[p]=S.ans[p]||{};S.marks[p]=S.marks[p]||{};
  startTimer(endSection);
  if(p==="awa")awaView();else qView();
}
function breakScreen(){
  S.deadline=Date.now()+600000;startTimer(nextStep);
  app.innerHTML='<div class="win"><div class="topbar"><div class="ttl">Break</div><div class="clock tnum" id="clock">10:00</div></div><div class="center"><div class="card"><h2>Optional break</h2><p>You have finished the first three sections. The test resumes automatically when the clock reaches zero, or you can continue now.</p><p><button class="btn primary" id="cont">Continue to the next section</button></p></div></div></div>';
  document.getElementById("cont").onclick=function(){stopTimer();nextStep()};
  tick();
}
function startTimer(onEnd){stopTimer();S.onEnd=onEnd;tick();timer=setInterval(tick,500)}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function tick(){
  if(!S)return;
  var left=Math.round((S.deadline-Date.now())/1000);
  var c=document.getElementById("clock");
  if(c){
    var hidden=S.hideTime&&left>300;
    c.textContent=hidden?"--:--":mmss(left);
    c.classList.toggle("low",left<=300);
    var b=document.getElementById("hide");if(b)b.textContent=hidden?"Show Time":"Hide Time";
  }
  if(left<=0){var f=S.onEnd;stopTimer();timeUp(f)}
}
function timeUp(f){
  var d=document.createElement("div");d.className="modal";
  d.innerHTML='<div class="box"><h3>Time is up</h3><p>Your time for this section has ended. Your answers have been saved.</p><div class="acts"><button class="btn primary" id="ok">Continue</button></div></div>';
  document.body.appendChild(d);d.querySelector("#ok").onclick=function(){d.remove();f()};
}
function endSection(){
  stopTimer();calcOpen=false;
  var p=S.plan[S.step];S.done[p]=true;
  nextStep();
}

/* ---------- AWA ---------- */
function wordCount(t){var m=t.trim().match(/\S+/g);return m?m.length:0}
function awaView(){
  var h='<div class="win"><div class="topbar"><div><div class="ttl">Analyze an Issue</div><div class="sub">Section 1 &middot; Practice Test '+S.n+'</div></div><div class="tools"><button id="hide">Hide Time</button><div class="clock tnum" id="clock"></div></div></div>'+
  '<div class="body two"><div class="pane left"><div class="passage">'+rich(S.D.awa.prompt)+'</div></div><div class="pane"><div class="awa-wrap"><div class="tools" style="gap:6px"><button class="btn" id="cut">Cut</button><button class="btn" id="copy">Copy</button><button class="btn" id="undo">Undo</button><button class="btn" id="redo">Redo</button><span class="wc" id="wc" style="margin-left:auto;align-self:center"></span></div><textarea class="awa-box" id="essay" spellcheck="false" aria-label="Your essay"></textarea><div class="wc">Paste with Ctrl+V or Cmd+V. Spell check and grammar check are off, as on the real test.</div></div></div></div>'+
  '<div class="footbar"><div class="grp"><button class="btn danger" id="exitsec">Finish section</button></div><div class="grp"></div></div></div>';
  app.innerHTML=h;
  var ta=document.getElementById("essay");ta.value=S.awa;
  function upd(){S.awa=ta.value;document.getElementById("wc").textContent=wordCount(ta.value)+" words"}
  ta.oninput=upd;upd();
  [["cut","cut"],["copy","copy"],["undo","undo"],["redo","redo"]].forEach(function(x){document.getElementById(x[0]).onclick=function(){ta.focus();try{document.execCommand(x[1])}catch(e){}upd()}});
  document.getElementById("hide").onclick=function(){S.hideTime=!S.hideTime;tick()};
  document.getElementById("exitsec").onclick=function(){confirmExit()};
  tick();
}

/* ---------- question screens ---------- */
function curSec(){return secInfo(S.plan[S.step])}
function curAns(){return S.ans[S.plan[S.step]]}
function isAnswered(q,a){
  if(a==null)return false;
  if(q.kind==="multi")return a.length>0;
  if(q.kind==="blanks")return q.blanks.every(function(_,i){return a[i]!=null});
  if(q.kind==="fraction")return a[0]!==""&&a[1]!==""&&a[0]!=null&&a[1]!=null;
  if(q.kind==="numeric")return String(a).trim()!=="";
  return true;
}
function qView(){
  var sec=curSec(),q=sec.questions[S.qi],si=S.plan[S.step],isQ=sec.type==="quant";
  var marked=!!S.marks[si][S.qi];
  var two=hasPassage(q);
  var h='<div class="win"><div class="topbar"><div><div class="ttl">'+esc(sec.name)+'</div><div class="sub">Practice Test '+S.n+' &middot; Question '+(S.qi+1)+' of '+sec.questions.length+'</div></div>'+
  '<div class="tools">'+(isQ?'<button id="calcb">Calculator</button>':'')+'<button id="mark" class="'+(marked?'on':'')+'">'+(marked?'Marked':'Mark')+'</button><button id="rev">Review</button><button id="exitsec">Exit Section</button><button id="hide">Hide Time</button><div class="clock tnum" id="clock"></div></div></div>'+
  '<div class="body'+(two?' two':'')+'" id="qbody">'+questionHTML(q,curAns()[S.qi],S.id,false,two)+'</div>'+
  '<div class="footbar"><div class="grp"><button class="btn" id="back"'+(S.qi===0?' disabled':'')+'>Back</button></div><div class="grp"><button class="btn primary" id="next">'+(S.qi===sec.questions.length-1?'Review':'Next')+'</button></div></div></div>';
  app.innerHTML=h;
  bindQ(q,function(v){curAns()[S.qi]=v;});
  document.getElementById("mark").onclick=function(){S.marks[si][S.qi]=!S.marks[si][S.qi];qView()};
  document.getElementById("rev").onclick=reviewList;
  document.getElementById("exitsec").onclick=confirmExit;
  document.getElementById("hide").onclick=function(){S.hideTime=!S.hideTime;tick()};
  document.getElementById("back").onclick=function(){S.qi--;qView()};
  document.getElementById("next").onclick=function(){if(S.qi===sec.questions.length-1)reviewList();else{S.qi++;qView()}};
  var cb=document.getElementById("calcb");if(cb)cb.onclick=function(){calcOpen=!calcOpen;drawCalc()};
  drawCalc();tick();
}
function reviewList(){
  var sec=curSec(),si=S.plan[S.step],a=curAns();
  var un=0;
  var g=sec.questions.map(function(q,i){
    var ok=isAnswered(q,a[i]);if(!ok)un++;
    return '<button data-i="'+i+'" class="'+(ok?'ans':'un')+'"><span>Question '+(i+1)+'</span><span class="st">'+(ok?'Answered':'Not answered')+(S.marks[si][i]?' <span class="flag">&#9873;</span>':'')+'</span></button>';
  }).join("");
  app.innerHTML='<div class="win"><div class="topbar"><div><div class="ttl">Review &middot; '+esc(sec.name)+'</div><div class="sub">Practice Test '+S.n+'</div></div><div class="tools"><button id="hide">Hide Time</button><div class="clock tnum" id="clock"></div></div></div><div class="center"><div class="card"><h2>Review your answers</h2><p>'+(un?'<b>'+un+' unanswered.</b> ':'All questions answered. ')+'Select a question to go back to it. Flagged questions are marked.</p><div class="rv">'+g+'</div></div></div><div class="footbar"><div class="grp"><button class="btn" id="ret">Return to question</button></div><div class="grp"><button class="btn danger" id="exitsec">Exit Section</button></div></div></div>';
  app.querySelectorAll(".rv button").forEach(function(b){b.onclick=function(){S.qi=+b.dataset.i;qView()}});
  document.getElementById("ret").onclick=qView;
  document.getElementById("exitsec").onclick=confirmExit;
  document.getElementById("hide").onclick=function(){S.hideTime=!S.hideTime;tick()};
  tick();
}
function confirmExit(){
  var d=document.createElement("div");d.className="modal";
  d.innerHTML='<div class="box"><h3>Exit this section?</h3><p>You will not be able to return to it. Any unanswered questions will be scored as incorrect.</p><div class="acts"><button class="btn" id="no">Stay in section</button><button class="btn danger" id="yes">Exit section</button></div></div>';
  document.body.appendChild(d);
  d.querySelector("#no").onclick=function(){d.remove()};
  d.querySelector("#yes").onclick=function(){d.remove();endSection()};
}

/* ---------- question rendering (shared by test and answer review) ---------- */
function hasPassage(q){return !!(q.passageId||q.kind==="select-sentence")}
function passageHTML(q,S2,rev,a){
  if(q.kind==="select-sentence"&&q.sentences){
    return '<div class="passage"><p>'+q.sentences.map(function(s,i){
      var c="sent";if(rev){if(i===q.answer)c+=" right";else if(a===i)c+=" wrong"}else if(a===i)c+=" sel";
      return '<span class="'+c+'" tabindex="0" role="button" data-s="'+i+'">'+inl(s)+'</span>';
    }).join(" ")+'</p></div>';
  }
  var p=(window.GRE[S2.id].passages||{})[q.passageId]||"";
  var html=rich(p);
  if(q.highlight){var hl=esc(q.highlight);var ix=html.indexOf(hl);if(ix>=0)html=html.slice(0,ix)+'<mark style="background:#ffe27a;color:inherit;padding:0 1px">'+hl+'</mark>'+html.slice(ix+hl.length)}
  return '<div class="passage">'+html+'</div>';
}
function questionHTML(q,a,id,rev,two){
  var D=window.GRE[id],h="";
  var qh="";
  if(q.uncertain)qh+='<div class="warn">This question was transcribed from a photo and may contain a reading error'+(q.note?' ('+esc(q.note)+')':'')+'.'+(q.images&&q.images.length?' Open the source photo below to check.':'')+'</div>';
  var pre=q.preface||q.header||q.groupNote;
  if(pre)qh+='<p class="note">'+inl(pre)+'</p>';
  if(q.kind==="qc"){
    if(q.info)qh+='<div class="info">'+inl(q.info)+'</div>';
    if(q.stem&&q.stem!==q.info)qh+='<div class="info">'+inl(q.stem)+'</div>';
    qh+='<div class="qc"><div><span class="lab">Quantity A</span>'+inl(q.quantityA)+'</div><div><span class="lab">Quantity B</span>'+inl(q.quantityB)+'</div></div>';
  }else if(q.kind==="blanks"){
    var stem=esc(q.stem).replace(/\[(Blank[^\]]*)\]/gi,'<span class="blank-pill">$1</span>');
    stem=stem.replace(/&lt;(\/?)(sup|sub|i|b|u)&gt;/gi,"<$1$2>");
    qh+='<div class="stem">'+stem.split(/\n\n+/).map(function(p){return "<p>"+p+"</p>"}).join("")+'</div>';
  }else if(q.stem){
    qh+='<div class="stem">'+rich(q.stem)+'</div>';
  }
  if(q.table)qh+='<div class="table-wrap">'+q.table+'</div>';
  if(q.images&&q.images.length)qh+=q.images.map(function(im){return '<figure class="fig"><img src="'+imgUrl(id,im)+'" alt="Figure for this question" data-zoom="1"><figcaption>Source photo of the question screen. Select to enlarge.</figcaption></figure>'}).join("");
  if(q.figureText&&!q.images)qh+='<p class="figtext">'+inl(q.figureText)+'</p>';
  var cls=function(i,sel,ok){return "choice"+(rev?(ok?" right":(sel?" wrong":"")):(sel?" sel":""))};
  if(q.kind==="single"||q.kind==="qc"){
    var ch=q.kind==="qc"?["Quantity A is greater.","Quantity B is greater.","The two quantities are equal.","The relationship cannot be determined from the information given."]:q.choices;
    qh+='<fieldset class="choices" role="radiogroup"><legend class="instr" style="margin:0 0 8px;padding:0">Select one answer choice.</legend>'+ch.map(function(c,i){return '<label class="'+cls(i,a===i,i===q.answer)+'"><input type="radio" name="q" value="'+i+'"'+(a===i?' checked':'')+(rev?' disabled':'')+'><span>'+inl(c)+'</span></label>'}).join("")+'</fieldset>';
  }else if(q.kind==="multi"){
    qh+='<fieldset class="choices"><legend class="instr" style="margin:0 0 8px;padding:0">Select all that apply.</legend>'+q.choices.map(function(c,i){var sel=a&&a.indexOf(i)>=0;return '<label class="'+cls(i,sel,q.answer.indexOf(i)>=0)+'"><input type="checkbox" name="q" value="'+i+'"'+(sel?' checked':'')+(rev?' disabled':'')+'><span>'+inl(c)+'</span></label>'}).join("")+'</fieldset>';
  }else if(q.kind==="blanks"){
    qh+='<div class="blanksgrid">'+q.blanks.map(function(b,bi){return '<fieldset class="choices" style="min-width:0"><legend>'+esc(b.label)+'</legend>'+b.choices.map(function(c,i){var sel=a&&a[bi]===i;return '<label class="'+cls(i,sel,q.answer[bi]===i)+'"><input type="radio" name="b'+bi+'" data-b="'+bi+'" value="'+i+'"'+(sel?' checked':'')+(rev?' disabled':'')+'><span>'+inl(c)+'</span></label>'}).join("")+'</fieldset>'}).join("")+'</div><div class="instr">Select one entry from each column.</div>';
  }else if(q.kind==="numeric"){
    qh+='<input class="numin" id="num" inputmode="decimal" autocomplete="off" value="'+esc(a||"")+'"'+(rev?' disabled':'')+' aria-label="Answer"><span style="margin-left:8px">'+(q.unit?inl(q.unit):'')+'</span><div class="instr">Click the box and type a number. Backspace to erase.</div>';
  }else if(q.kind==="fraction"){
    qh+='<div class="frac"><input class="numin" id="fn" inputmode="decimal" autocomplete="off" value="'+esc(a?a[0]:"")+'"'+(rev?' disabled':'')+' aria-label="Numerator"><hr><input class="numin" id="fd" inputmode="decimal" autocomplete="off" value="'+esc(a?a[1]:"")+'"'+(rev?' disabled':'')+' aria-label="Denominator"></div><div class="instr">Enter the answer as a fraction. Click each box and type a number.</div>';
  }else if(q.kind==="select-sentence"){
    qh+='<div class="instr">Click the sentence in the passage that answers the question.</div>';
  }
  if(rev)qh+=explainHTML(q,a);
  var pass=hasPassage(q)?'<div class="pane left">'+passageHTML(q,{id:id},rev,a)+'</div>':"";
  return pass+'<div class="pane"><div class="'+(two?'':'single')+'">'+qh+'</div></div>';
}
function correctText(q){
  if(q.kind==="single")return q.choices[q.answer];
  if(q.kind==="qc")return ["Quantity A is greater.","Quantity B is greater.","The two quantities are equal.","The relationship cannot be determined from the information given."][q.answer];
  if(q.kind==="multi")return q.answer.map(function(i){return q.choices[i]}).join("  |  ");
  if(q.kind==="blanks")return q.answer.map(function(v,i){return q.blanks[i].label+": "+q.blanks[i].choices[v]}).join("  |  ");
  if(q.kind==="select-sentence")return q.sentences[q.answer];
  return String(q.answer);
}
function explainHTML(q,a){
  return '<div class="expl"><b>Correct answer:</b> '+inl(correctText(q))+'</div>';
}
function bindQ(q,save){
  var root=document.getElementById("qbody");
  root.querySelectorAll("img[data-zoom]").forEach(function(im){im.onclick=function(){var z=document.createElement("div");z.className="zoom";z.innerHTML='<img src="'+im.src+'" alt="Enlarged">';z.onclick=function(){z.remove()};document.body.appendChild(z)}});
  if(q.kind==="single"||q.kind==="qc"){
    root.querySelectorAll("input[name=q]").forEach(function(i){i.onchange=function(){save(+i.value);root.querySelectorAll(".choice").forEach(function(l){l.classList.toggle("sel",l.contains(i))})}});
  }else if(q.kind==="multi"){
    root.querySelectorAll("input[name=q]").forEach(function(i){i.onchange=function(){var v=[];root.querySelectorAll("input[name=q]").forEach(function(x){if(x.checked)v.push(+x.value);x.closest(".choice").classList.toggle("sel",x.checked)});save(v)}});
  }else if(q.kind==="blanks"){
    var cur=(curAns()[S.qi]||[]).slice();
    root.querySelectorAll("input[data-b]").forEach(function(i){i.onchange=function(){cur[+i.dataset.b]=+i.value;save(cur.slice());root.querySelectorAll("input[name=b"+i.dataset.b+"]").forEach(function(x){x.closest(".choice").classList.toggle("sel",x.checked)})}});
  }else if(q.kind==="numeric"){
    document.getElementById("num").oninput=function(e){save(e.target.value)};
  }else if(q.kind==="fraction"){
    var f=function(){save([document.getElementById("fn").value,document.getElementById("fd").value])};
    document.getElementById("fn").oninput=f;document.getElementById("fd").oninput=f;
  }else if(q.kind==="select-sentence"){
    root.querySelectorAll(".sent").forEach(function(s){var pick=function(){save(+s.dataset.s);root.querySelectorAll(".sent").forEach(function(x){x.classList.toggle("sel",x===s)})};s.onclick=pick;s.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();pick()}}});
  }
}

/* ---------- scoring ---------- */
function num(s){
  s=String(s).trim().replace(/,/g,"");if(!s)return NaN;
  var m=s.match(/^(-?[\d.]+)\s*\/\s*(-?[\d.]+)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);
  return parseFloat(s);
}
function correct(q,a){
  if(a==null)return false;
  switch(q.kind){
    case "single":case "qc":case "select-sentence":return a===q.answer;
    case "multi":return a.length===q.answer.length&&a.slice().sort().join()===q.answer.slice().sort().join();
    case "blanks":return q.answer.every(function(v,i){return a[i]===v});
    case "numeric":{var x=num(a),y=num(q.answer);return isFinite(x)&&Math.abs(x-y)<=1e-6*Math.max(1,Math.abs(y))+1e-9}
    case "fraction":{var n=num(a[0]),d=num(a[1]),y=num(q.answer);return isFinite(n)&&isFinite(d)&&d!==0&&Math.abs(n/d-y)<1e-6}
  }
  return false;
}
function sectionScore(si){
  var sec=S.D.sections[si],a=S.ans[si]||{},c=0;
  sec.questions.forEach(function(q,i){if(correct(q,a[i]))c++});
  return {c:c,t:sec.questions.length};
}
function est(c,t){return Math.round(130+(c/t)*40)}
function results(){
  stopTimer();calcOpen=false;
  var rows="",vc=0,vt=0,qc=0,qt=0,tried=[];
  S.plan.forEach(function(p){
    if(p==="awa"||p==="break")return;
    var r=sectionScore(p),sec=S.D.sections[p];tried.push(p);
    if(sec.type==="verbal"){vc+=r.c;vt+=r.t}else{qc+=r.c;qt+=r.t}
    rows+='<tr><td>'+esc(sec.name)+'</td><td>'+r.c+' / '+r.t+'</td><td>'+Math.round(r.c/r.t*100)+'%</td></tr>';
  });
  var sc="";
  if(vt)sc+='<div><div class="big">'+est(vc,vt)+'</div><div class="cap">Verbal estimate</div></div>';
  if(qt)sc+='<div><div class="big">'+est(qc,qt)+'</div><div class="cap">Quant estimate</div></div>';
  if(S.plan.indexOf("awa")>=0)sc+='<div><div class="big">'+wordCount(S.awa)+'</div><div class="cap">Essay words</div></div>';
  if(S.mode==="full"){var hist=LS.get("gre-hist")||{};hist[S.n]={v:est(vc,vt),q:est(qc,qt),when:new Date().toLocaleDateString()};LS.set("gre-hist",hist)}
  var h='<div class="win"><div class="topbar"><div class="ttl">Practice Test '+S.n+' &middot; Results</div><div class="tools"><button id="home">All tests</button></div></div><div class="center"><div class="card"><h2>Test complete</h2><div class="scoreline">'+sc+'</div><p style="font-size:13px;color:var(--ink2)">Score estimates use a simple linear scale from 130 to 170 based on your percent correct. The real GRE adapts the second section to your first, so treat these as a rough guide only.</p>'+
  (rows?'<table class="res"><thead><tr><th>Section</th><th>Correct</th><th>Percent</th></tr></thead><tbody>'+rows+'</tbody></table>':'')+
  (S.plan.indexOf("awa")>=0?'<h3>Your essay</h3><div class="essay">'+esc(S.awa||"(No essay written)")+'</div><p style="font-size:13px;color:var(--ink2)">The writing task is not machine scored. Compare your essay with the issue prompt in the review.</p>':'')+
  '<p style="margin-top:22px;display:flex;gap:8px;flex-wrap:wrap">'+(tried.length?'<button class="btn primary" id="revans">Review questions and answers</button>':'')+'<button class="btn" id="home2">Back to all tests</button></p></div></div></div>';
  app.innerHTML=h;
  document.getElementById("home").onclick=home;document.getElementById("home2").onclick=home;
  var r=document.getElementById("revans");if(r)r.onclick=function(){S.rs=tried[0];S.rq=0;answerReview()};
}
function answerReview(){
  var secs=S.plan.filter(function(p){return p!=="awa"&&p!=="break"});
  var sec=S.D.sections[S.rs],q=sec.questions[S.rq],a=(S.ans[S.rs]||{})[S.rq];
  var ok=correct(q,a),two=hasPassage(q);
  var tabs=secs.map(function(p){return '<button data-sec="'+p+'" class="'+(p===S.rs?'on':'')+'">'+esc(S.D.sections[p].name)+'</button>'}).join("");
  var chips=sec.questions.map(function(qq,i){var c=correct(qq,(S.ans[S.rs]||{})[i]);return '<button data-i="'+i+'" style="min-width:34px;'+(i===S.rq?'outline:2px solid #fff;':'')+(c?'':'background:var(--bad);border-color:var(--bad);')+'">'+(i+1)+'</button>'}).join("");
  app.innerHTML='<div class="win"><div class="topbar"><div><div class="ttl">Answer review &middot; '+esc(sec.name)+'</div><div class="sub">Question '+(S.rq+1)+' of '+sec.questions.length+' &middot; '+(ok?'Correct':(a==null||!isAnswered(q,a)?'Not answered':'Incorrect'))+'</div></div><div class="tools" id="tabs">'+tabs+'<button id="done">Close</button></div></div><div class="subbar"><div class="tools" id="chips" style="gap:4px">'+chips+'</div><div>Your answers are shown in red when wrong. The correct choice is green.</div></div><div class="body'+(two?' two':'')+'" id="qbody">'+questionHTML(q,a,S.id,true,two)+'</div><div class="footbar"><div class="grp"><button class="btn" id="b">Back</button></div><div class="grp"><button class="btn primary" id="n">Next</button></div></div></div>';
  var st=document.createElement("style");st.textContent="#tabs button.on{background:var(--mark);color:#1b1500;border-color:var(--mark)}#chips button{color:#fff;background:var(--good);border:1px solid var(--good);border-radius:3px;padding:2px 8px;font-size:12px}";
  app.firstChild.appendChild(st);
  var bd=document.getElementById("qbody");bd.querySelectorAll("img[data-zoom]").forEach(function(im){im.onclick=function(){var z=document.createElement("div");z.className="zoom";z.innerHTML='<img src="'+im.src+'" alt="Enlarged">';z.onclick=function(){z.remove()};document.body.appendChild(z)}});
  document.getElementById("done").onclick=results;
  document.querySelectorAll("#tabs [data-sec]").forEach(function(b){b.onclick=function(){S.rs=+b.dataset.sec;S.rq=0;answerReview()}});
  document.querySelectorAll("#chips [data-i]").forEach(function(b){b.onclick=function(){S.rq=+b.dataset.i;answerReview()}});
  document.getElementById("b").onclick=function(){if(S.rq>0){S.rq--;answerReview()}else{var i=secs.indexOf(S.rs);if(i>0){S.rs=secs[i-1];S.rq=S.D.sections[S.rs].questions.length-1;answerReview()}}};
  document.getElementById("n").onclick=function(){if(S.rq<sec.questions.length-1){S.rq++;answerReview()}else{var i=secs.indexOf(S.rs);if(i<secs.length-1){S.rs=secs[i+1];S.rq=0;answerReview()}}};
}

/* ---------- calculator ---------- */
var calcExpr="",calcShow="0";
function drawCalc(){
  var old=document.getElementById("calc");if(old)old.remove();
  if(!calcOpen)return;
  var keys=["7","8","9","/","4","5","6","*","1","2","3","-","0",".","(","+","C","⌫","sqrt","="];
  var d=document.createElement("div");d.id="calc";d.className="calc";
  d.innerHTML='<div class="hd"><span>Calculator</span><button id="cx" aria-label="Close calculator">Close</button></div><div class="scr" id="scr">'+esc(calcShow)+'</div><div class="keys">'+keys.map(function(k){return '<button class="'+(k==="="?"eq":(/[\/*\-+()]/.test(k)||k==="sqrt"?"op":""))+'" data-k="'+k+'">'+(k==="*"?"×":k==="/"?"÷":k==="sqrt"?"√":k)+'</button>'}).join("")+'</div>';
  document.body.appendChild(d);
  d.querySelector("#cx").onclick=function(){calcOpen=false;drawCalc()};
  d.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){
    var k=b.dataset.k;
    if(k==="C"){calcExpr="";calcShow="0"}
    else if(k==="⌫"){calcExpr=calcExpr.slice(0,-1);calcShow=calcExpr||"0"}
    else if(k==="="){try{if(/^[\d+\-*\/.() ]*$/.test(calcExpr)&&calcExpr){var v=Function('"use strict";return ('+calcExpr+')')();calcExpr=String(+v.toFixed(10));calcShow=calcExpr}}catch(e){calcExpr="";calcShow="Error"}}
    else if(k==="sqrt"){try{var v2=Math.sqrt(Function('"use strict";return ('+(calcExpr||"0")+')')());calcExpr=String(+v2.toFixed(10));calcShow=calcExpr}catch(e){calcExpr="";calcShow="Error"}}
    else{calcExpr+=k;calcShow=calcExpr}
    d.querySelector("#scr").textContent=calcShow;
  }});
}
home();
</script>
